<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f3d5c"/>
      <stop offset="100%" stop-color="#155a86"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7f8c8d"/>
    </marker>
  </defs>
  <rect width="820" height="520" fill="#f8fafc" stroke="#c8d1dc"/>
  <rect width="820" height="40" fill="url(#hdr)"/>
  <text x="24" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#ffffff" font-weight="600">M5 P4 — Real-Time Fraud Detection Engine Architecture</text>
  <text x="796" y="26" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#cfe3f0">Ingest · Detect · Prioritize · Benchmark · Report</text>

  <!-- A: Ingestion + batching -->
  <rect x="40" y="58" width="740" height="82" rx="8" fill="#eaf2fb" stroke="#2980b9" stroke-width="1" stroke-dasharray="4 3" opacity="0.55"/>
  <text x="56" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#2980b9" font-weight="700">A — INGESTION &amp; BATCH PROCESSING</text>
  <rect x="60" y="88" width="220" height="40" rx="6" fill="#ffffff" stroke="#2980b9" stroke-width="1.5"/>
  <text x="170" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1a252f" font-weight="600">generator.py</text>
  <rect x="300" y="88" width="220" height="40" rx="6" fill="#ffffff" stroke="#2980b9" stroke-width="1.5"/>
  <text x="410" y="106" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1a252f" font-weight="600">batch.process_in_batches</text>
  <text x="410" y="120" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5d6d7e">Activity 1 · thread pool</text>
  <rect x="540" y="88" width="220" height="40" rx="6" fill="#ffffff" stroke="#2980b9" stroke-width="1.5"/>
  <text x="650" y="112" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1a252f" font-weight="600">1,000 transactions/run</text>

  <!-- B: Detection layer -->
  <rect x="40" y="156" width="740" height="110" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1" stroke-dasharray="4 3" opacity="0.55"/>
  <text x="56" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#27ae60" font-weight="700">B — DETECTION LAYER (common.patterns)</text>
  <rect x="60" y="188" width="220" height="60" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="170" y="212" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1a252f" font-weight="600">prefilter_candidates</text>
  <text x="170" y="228" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5d6d7e">rule pass · all 1,000 · no LLM</text>
  <text x="170" y="242" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5d6d7e">Activity 2</text>
  <rect x="300" y="188" width="220" height="60" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="410" y="212" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1a252f" font-weight="600">classify_with_claude</text>
  <text x="410" y="228" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5d6d7e">ML-style pattern match</text>
  <text x="410" y="242" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5d6d7e">candidates only · Activity 2</text>
  <rect x="540" y="188" width="220" height="60" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="650" y="212" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1a252f" font-weight="600">fraud_score + patterns</text>
  <text x="650" y="228" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5d6d7e">VELOCITY · AMOUNT · ODD_HOUR</text>
  <text x="650" y="242" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5d6d7e">NEW_DEVICE · MERCHANT · GEO</text>

  <!-- C: Risk + metrics -->
  <rect x="40" y="282" width="740" height="90" rx="8" fill="#fdf2e9" stroke="#e67e22" stroke-width="1" stroke-dasharray="4 3" opacity="0.55"/>
  <text x="56" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#d35400" font-weight="700">C — RISK PRIORITIZATION &amp; BENCHMARK</text>
  <rect x="60" y="312" width="235" height="44" rx="6" fill="#ffffff" stroke="#e67e22" stroke-width="1.5"/>
  <text x="177" y="332" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1a252f" font-weight="600">risk.prioritize_queue</text>
  <text x="177" y="348" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5d6d7e">HIGH / MEDIUM / LOW · Activity 3</text>
  <rect x="310" y="312" width="235" height="44" rx="6" fill="#ffffff" stroke="#e67e22" stroke-width="1.5"/>
  <text x="427" y="332" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1a252f" font-weight="600">metrics.build_benchmark_result</text>
  <text x="427" y="348" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5d6d7e">throughput + p50/p95/p99 · Activity 4</text>
  <rect x="560" y="312" width="200" height="44" rx="6" fill="#ffffff" stroke="#e67e22" stroke-width="1.5"/>
  <text x="660" y="332" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1a252f" font-weight="600">reporting.write_report</text>
  <text x="660" y="348" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5d6d7e">daily summary · Activity 5</text>

  <!-- D: sinks -->
  <rect x="60" y="398" width="330" height="46" rx="6" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="225" y="418" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1a252f" font-weight="600">Fraud analyst queue (HIGH tier, sorted)</text>
  <text x="225" y="434" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5d6d7e">immediate review</text>
  <rect x="430" y="398" width="330" height="46" rx="6" fill="#fbeee9" stroke="#c0392b" stroke-width="1.5"/>
  <text x="595" y="418" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1a252f" font-weight="600">reports/DAILY_FRAUD_SUMMARY.md</text>
  <text x="595" y="434" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5d6d7e">+ benchmark_result.json</text>

  <!-- flow arrows -->
  <line x1="410" y1="140" x2="410" y2="154" stroke="#7f8c8d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="266" x2="410" y2="280" stroke="#7f8c8d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="177" y1="356" x2="225" y2="396" stroke="#7f8c8d" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="356" x2="595" y2="396" stroke="#7f8c8d" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- footer -->
  <text x="24" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#7f8c8d">Batching keeps throughput up; the prefilter keeps only candidates on the expensive LLM path; risk tiers and the benchmark are what the fraud desk and engineering leads read.</text>
  <text x="24" y="488" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#7f8c8d">Target: 1,000 transactions/run · throughput ≥ target_tps · p95/p99 latency bounded.</text>
</svg>
